<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="-400 -400 800 800">
  <rect x="-400" y="-400" width="800" height="800" fill="#ffffff"/>
  <g stroke="#111" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- folhas -->
    <path d="M-40,120 C-150,90 -250,150 -300,250 C-200,270 -100,230 -40,120 Z" fill="#2f8a4a"/>
    <path d="M40,120 C150,90 250,150 300,250 C200,270 100,230 40,120 Z" fill="#2f8a4a"/>
    <path d="M-60,140 C-140,170 -210,210 -270,245" fill="none" stroke-width="5"/>
    <path d="M60,140 C140,170 210,210 270,245" fill="none" stroke-width="5"/>
    <!-- pétalas externas -->
    <circle cx="0" cy="-150" r="120" fill="#c8262e"/>
    <circle cx="140" cy="-45" r="120" fill="#c8262e"/>
    <circle cx="88" cy="120" r="120" fill="#c8262e"/>
    <circle cx="-88" cy="120" r="120" fill="#c8262e"/>
    <circle cx="-140" cy="-45" r="120" fill="#c8262e"/>
    <!-- miolo -->
    <circle r="120" fill="#e0453a"/>
    <circle r="70" fill="#f2c230"/>
    <circle r="30" fill="#d18a14"/>
  </g>
  <!-- brilhos brancos (ambíguos: pele ou tinta branca) -->
  <g fill="#ffffff">
    <ellipse cx="-40" cy="-200" rx="34" ry="14" transform="rotate(-20 -40 -200)"/>
    <ellipse cx="170" cy="-90" rx="30" ry="12" transform="rotate(40 170 -90)"/>
    <circle cx="-22" cy="-28" r="12"/>
  </g>
  <!-- pontilhado de sombra -->
  <g fill="#111">
    <circle cx="-60" cy="40" r="5"/><circle cx="-45" cy="58" r="5"/><circle cx="-75" cy="62" r="5"/>
    <circle cx="60" cy="40" r="5"/><circle cx="45" cy="58" r="5"/><circle cx="75" cy="62" r="5"/>
  </g>
</svg>
