# Monta os apps nativos a cada mudança no app:
# - Android: gera um APK de teste (baixe em Actions > esta execução > Artifacts);
# - iOS: compila para o simulador num Mac, só para garantir que o projeto do iPhone está ok
#   (instalar no iPhone de verdade precisa da conta de desenvolvedor da Apple e do TestFlight).
name: Apps (Android e iOS)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # O Capacitor 8 compila o Android com Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            web/android/*.gradle*
            web/android/**/gradle-wrapper.properties

      - run: npm ci
      # O "prebuild" baixa os modelos do MediaPipe; eles vão dentro do app (funciona offline).
      - run: npm run build
      - run: npx cap sync android

      - name: Montar o APK de teste
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: provink-android-teste
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # A pasta ios/ não fica no repositório: é gerada como no Mac (Capacitor + CocoaPods + ajustes
      # do Provink, em scripts/ios.mjs).
      - run: npm run ios:ci

      - name: Compilar para o simulador do iPhone (sem assinatura)
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
